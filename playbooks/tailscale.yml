- name: Install Tailscale and join the tailnet
  hosts: tailscale_nodes
  become: true

  vars:
    headscale_url: https://hs.unbeholden.dev

  vars_prompt:
    - name: tailscale_authkey
      prompt: Headscale pre-auth key, created with --tags for tagged nodes (blank if every node is already joined)
      private: true
      unsafe: true

  tasks:
    - name: Install deb822_repository's dependency
      ansible.builtin.apt:
        name: python3-debian

    - name: Add the Tailscale apt repository
      ansible.builtin.deb822_repository:
        name: tailscale
        uris: https://pkgs.tailscale.com/stable/{{ ansible_facts.distribution | lower }}
        suites: "{{ ansible_facts.distribution_release }}"
        components: main
        signed_by: "https://pkgs.tailscale.com/stable/{{ ansible_facts.distribution | lower }}/{{ ansible_facts.distribution_release }}.noarmor.gpg"

    # Tailscale's install script writes this; left in place, apt sees the repo twice.
    - name: Remove the install script's apt source
      ansible.builtin.file:
        path: /etc/apt/sources.list.d/tailscale.list
        state: absent

    - name: Install Tailscale
      ansible.builtin.apt:
        name: tailscale
        update_cache: true

    - name: Enable IP forwarding for subnet routes
      ansible.posix.sysctl:
        name: net.ipv4.ip_forward
        value: "1"
        sysctl_file: /etc/sysctl.d/99-tailscale.conf
      when: tailscale_routes is defined

    - name: Read Tailscale state
      ansible.builtin.command: tailscale status
      register: tailscale_status
      changed_when: false
      failed_when: false

    # Without a key, tailscale up waits forever for an interactive login.
    - name: Check a key was given
      ansible.builtin.assert:
        that: tailscale_authkey not in ['', 'None']
        fail_msg: "{{ inventory_hostname }} is not joined yet. Pass a pre-auth key."
        quiet: true
      when: tailscale_status.rc != 0

    - name: Join the tailnet
      ansible.builtin.command: >-
        tailscale up --reset
        --login-server {{ headscale_url }}
        --authkey {{ tailscale_authkey }}
        --advertise-routes={{ tailscale_routes | default('') }}
        --accept-dns=false
      when: tailscale_status.rc != 0
      no_log: true
      changed_when: true
