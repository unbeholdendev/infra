- name: Converge authorized_keys
  hosts: lxc:physical:vps:truenas
  tasks:
    - name: Refuse to run without a distribution key
      ansible.builtin.assert:
        that: distribution_key_files | length > 0
        fail_msg: keys/distribution/ holds no public key.
        quiet: true

    - name: Set authorized_keys to distribution + admin keys + declared host extras
      ansible.posix.authorized_key:
        user: "{{ ansible_user }}"
        exclusive: "{{ authorized_keys_exclusive }}"
        key: |
          {% for f in distribution_key_files + admin_key_files %}{{ lookup('file', f) }}
          {% endfor %}{% for f in extra_authorized_keys | default([]) %}{{ lookup('file', inventory_dir + '/' + f) }}
          {% endfor %}

- name: Ensure distribution and admin keys present on OpenWrt (additive)
  hosts: router
  gather_facts: false
  tasks:
    - name: Append each key to dropbear authorized_keys if absent
      ansible.builtin.raw: |
        grep -qF "{{ lookup('file', item) | trim }}" /etc/dropbear/authorized_keys 2>/dev/null \
          || echo "{{ lookup('file', item) | trim }}" >> /etc/dropbear/authorized_keys
      loop: "{{ distribution_key_files + admin_key_files }}"
      loop_control:
        label: "{{ item | basename }}"
