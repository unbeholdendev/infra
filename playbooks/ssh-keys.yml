- name: Converge authorized_keys
  hosts: lxc:physical:vps:truenas
  tasks:
    - name: Refuse to run without a distribution key
      ansible.builtin.assert:
        that: distribution_key_files | length > 0
        fail_msg: keys/distribution/ holds no public key.
        quiet: true

    - name: Set authorized_keys to distribution + admin keys + declared host extras
      ansible.posix.authorized_key:
        user: "{{ ansible_user }}"
        exclusive: "{{ authorized_keys_exclusive }}"
        key: |
          {% for f in distribution_key_files + admin_key_files %}{{ lookup('file', f) }}
          {% endfor %}{% for f in extra_authorized_keys | default([]) %}{{ lookup('file', inventory_dir + '/' + f) }}
          {% endfor %}

    - name: Remove revoked keys
      ansible.posix.authorized_key:
        user: "{{ ansible_user }}"
        key: "{{ lookup('file', item) }}"
        state: absent
      loop: "{{ revoked_key_files }}"
      loop_control:
        label: "{{ item | basename }}"

- name: Converge dropbear authorized_keys on OpenWrt (additive, minus revoked)
  hosts: router
  gather_facts: false
  tasks:
    - name: Append each key to dropbear authorized_keys if absent
      ansible.builtin.raw: |
        grep -qF "{{ lookup('file', item) | trim }}" /etc/dropbear/authorized_keys 2>/dev/null \
          || echo "{{ lookup('file', item) | trim }}" >> /etc/dropbear/authorized_keys
      loop: "{{ distribution_key_files + admin_key_files }}"
      loop_control:
        label: "{{ item | basename }}"

    - name: Remove revoked keys from dropbear authorized_keys
      ansible.builtin.raw: |
        f=/etc/dropbear/authorized_keys
        k="{{ (lookup('file', item) | split)[1] }}"
        grep -qF "$k" "$f" 2>/dev/null || exit 0
        grep -vF "$k" "$f" > "$f.new"
        [ $? -le 1 ] && [ "$(wc -l < "$f.new")" -eq "$(grep -cvF "$k" "$f")" ] \
          || { rm -f "$f.new"; echo "could not filter $f" >&2; exit 1; }
        chmod 600 "$f.new" && mv "$f.new" "$f" && echo removed
      register: revoked
      changed_when: "'removed' in revoked.stdout"
      loop: "{{ revoked_key_files }}"
      loop_control:
        label: "{{ item | basename }}"
