- name: Distribute Forgejo token and configure it as a git credential
  hosts: forgejo_clients
  gather_facts: false

  # Prompted at run time so the token never sits on the control machine's
  # disk. Ansible skips this prompt when the value is supplied another way,
  # e.g. -e forgejo_token="$FORGEJO_TOKEN" or from a vaulted var.
  vars_prompt:
    - name: forgejo_token
      prompt: Forgejo access token
      private: true
      unsafe: true

  vars:
    forgejo_token_file: ~/.forgejo-token

  tasks:
    # With no tty to prompt on, vars_prompt yields the string "None" rather
    # than failing, so check before writing anything to a target.
    - name: Check the token looks usable
      ansible.builtin.assert:
        that:
          - forgejo_token != 'None'
          - forgejo_token | length >= 8
        fail_msg: >-
          No usable Forgejo token. Enter one at the prompt, or pass
          -e forgejo_token="$FORGEJO_TOKEN" for a non-interactive run.
        quiet: true
      run_once: true
      delegate_to: localhost

    - name: Install the token file
      ansible.builtin.copy:
        content: "{{ forgejo_token }}\n"
        dest: "{{ forgejo_token_file }}"
        mode: "0600"
      no_log: true

    # Scoped to the Forgejo host on purpose: an unscoped credential.helper
    # would offer this token to every HTTPS remote git talks to.
    - name: Configure the credential helper
      community.general.git_config:
        name: "credential.{{ forgejo_url }}.helper"
        value: >-
          !f() { echo username={{ forgejo_username }};
          echo "password=$(cat {{ forgejo_token_file }})"; }; f
        scope: global

    - name: Verify git resolves a credential for the Forgejo host
      ansible.builtin.shell:
        cmd: >-
          set -o pipefail;
          printf 'protocol=https\nhost=%s\n\n' '{{ forgejo_url | urlsplit("hostname") }}'
          | git credential fill | grep -qE '^password=.+'
        executable: /bin/bash
      environment:
        GIT_TERMINAL_PROMPT: "0"
      changed_when: false
