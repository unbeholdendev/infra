apiVersion: k8up.io/v1
kind: PodConfig
metadata:
  name: backup
spec:
  template:
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: backup
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
