apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources:
  - backup.sops.yaml
  - podconfig.yaml
  - schedule.yaml
replacements:
  - source:
      kind: Namespace
    targets:
      - select:
          kind: Schedule
          name: backup
        fieldPaths:
          - spec.backend.rest.url
        options:
          delimiter: /
          index: 3
