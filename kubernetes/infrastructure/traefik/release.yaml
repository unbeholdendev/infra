apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: traefik
spec:
  interval: 1h
  url: https://traefik.github.io/charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
spec:
  interval: 1h
  install:
    crds: Skip
  upgrade:
    crds: Skip
  chart:
    spec:
      chart: traefik
      version: 42.1.3
      sourceRef:
        kind: HelmRepository
        name: traefik
  values:
    api:
      dashboard: false
      insecure: false
    ingressClass:
      name: traefik
      isDefaultClass: false
    providers:
      kubernetesCRD:
        enabled: false
      kubernetesIngress:
        enabled: true
    ports:
      websecure:
        expose:
          default: false
    service:
      annotations:
        metallb.io/address-pool: ingress
        metallb.io/loadBalancerIPs: 192.168.4.200
      spec:
        type: LoadBalancer
        allocateLoadBalancerNodePorts: false
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        memory: 256Mi
