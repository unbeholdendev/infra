apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: traefik
  namespace: traefik
spec:
  interval: 1h
  url: https://traefik.github.io/charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
  namespace: traefik
spec:
  interval: 1h
  install:
    crds: Create
  upgrade:
    crds: CreateReplace
  chart:
    spec:
      chart: traefik
      version: 42.3.1
      sourceRef:
        kind: HelmRepository
        name: traefik
  values:
    api:
      dashboard: false
      insecure: false
    ingressClass:
      name: traefik
      isDefaultClass: false
    providers:
      kubernetesCRD:
        enabled: true
      kubernetesIngress:
        enabled: true
    tlsStore:
      default:
        defaultCertificate:
          secretName: home-wildcard-tls
    ports:
      web:
        http:
          redirections:
            entryPoint:
              to: websecure
              scheme: https
              permanent: true
    service:
      annotations:
        metallb.io/address-pool: ingress
        metallb.io/loadBalancerIPs: 192.168.4.200
        metallb.io/allow-shared-ip: private-ingress
      spec:
        type: LoadBalancer
        allocateLoadBalancerNodePorts: false
        externalTrafficPolicy: Cluster
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        memory: 256Mi
