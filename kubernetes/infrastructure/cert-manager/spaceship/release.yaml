apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: spaceship-webhook
  namespace: cert-manager
spec:
  interval: 1h
  url: https://github.com/hjwylde/cert-manager-webhook-spaceship
  ref:
    commit: 8d417768d2d2a0ed72c6fb978943126c307103f2
  ignore: |
    /*
    !/charts/
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: spaceship-webhook
  namespace: cert-manager
spec:
  interval: 1h
  chart:
    spec:
      chart: ./charts/cert-manager-webhook-spaceship
      sourceRef:
        kind: GitRepository
        name: spaceship-webhook
  values:
    fullnameOverride: spaceship-webhook
    image:
      tag: 0.1.3@sha256:73c2854342f7c909714617357661846b1c15c850b2b9ad55568788d60ff5adcb
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        memory: 256Mi
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
              name: spaceship-webhook
            patch: |-
              - op: add
                path: /spec/template/spec/securityContext
                value:
                  runAsNonRoot: true
                  runAsUser: 65532
                  runAsGroup: 65532
                  seccompProfile:
                    type: RuntimeDefault
              - op: add
                path: /spec/template/spec/containers/0/securityContext
                value:
                  allowPrivilegeEscalation: false
                  readOnlyRootFilesystem: true
                  capabilities:
                    drop:
                      - ALL
              - op: add
                path: /spec/template/spec/containers/0/args/-
                value: --secure-port=8443
              - op: replace
                path: /spec/template/spec/containers/0/ports/0/containerPort
                value: 8443
          - target:
              kind: Role
              name: spaceship-webhook:access-secret
            patch: |-
              - op: replace
                path: /rules
                value:
                  - apiGroups:
                      - ""
                    resources:
                      - secrets
                    resourceNames:
                      - spaceship-credentials
                    verbs:
                      - get
