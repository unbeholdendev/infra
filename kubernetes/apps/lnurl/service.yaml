apiVersion: v1
kind: Service
metadata:
  name: lnurl
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8081
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: lnurl-goddard
  labels:
    kubernetes.io/service-name: lnurl
addressType: IPv4
ports:
  - name: http
    port: 8081
    protocol: TCP
endpoints:
  - addresses:
      - 192.168.4.11
