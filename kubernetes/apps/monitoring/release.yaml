apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: kube-prometheus-stack
  namespace: monitoring
spec:
  interval: 1h
  url: oci://ghcr.io/prometheus-community/charts/kube-prometheus-stack
  ref:
    tag: 93.9.0
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: monitoring
spec:
  interval: 1h
  timeout: 15m
  releaseName: kube-prometheus-stack
  chartRef:
    kind: OCIRepository
    name: kube-prometheus-stack
  install:
    crds: Create
  upgrade:
    crds: CreateReplace
  values:
    alertmanager:
      enabled: false
    kubeControllerManager:
      enabled: false
    kubeScheduler:
      enabled: false
    kubeEtcd:
      enabled: false
    kubeProxy:
      enabled: false
    prometheus-node-exporter:
      namespaceOverride: node-exporter
      prometheus:
        monitor:
          relabelings:
            - sourceLabels: [__meta_kubernetes_pod_node_name]
              targetLabel: instance
            - sourceLabels: [__meta_kubernetes_pod_node_name]
              regex: talos-.*
              targetLabel: host
              replacement: dion
    prometheus:
      prometheusSpec:
        retention: 15d
        retentionSize: 5GB
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: local-path
              accessModes:
                - ReadWriteOnce
              resources:
                requests:
                  storage: 6Gi
        additionalScrapeConfigs:
          - job_name: node-exporter
            static_configs:
              - targets: ["192.168.4.11:9100"]
                labels:
                  instance: goddard
                  host: rune
              - targets: ["192.168.4.101:9100"]
                labels:
                  instance: oren
                  host: dion
              - targets: ["192.168.4.16:9100"]
                labels:
                  instance: heine
                  host: dion
    kube-state-metrics:
      collectorsExclude:
        - secrets
    grafana:
      admin:
        existingSecret: grafana-admin
      rbac:
        namespaced: true
      sidecar:
        dashboards:
          searchNamespace: monitoring
      initChownData:
        enabled: false
      persistence:
        enabled: true
        storageClassName: local-path
        size: 1Gi
      ingress:
        enabled: true
        ingressClassName: traefik
        annotations:
          traefik.ingress.kubernetes.io/router.entrypoints: websecure
        hosts:
          - grafana.home.unbeholden.dev
      grafana.ini:
        server:
          root_url: https://grafana.home.unbeholden.dev
        analytics:
          reporting_enabled: false
          check_for_updates: false
