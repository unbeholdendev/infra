apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - grafana-admin.sops.yaml
  - release.yaml
configMapGenerator:
  - name: dashboard-hosts
    namespace: monitoring
    files:
      - hosts.json=dashboards/hosts.json
    options:
      labels:
        grafana_dashboard: "1"
