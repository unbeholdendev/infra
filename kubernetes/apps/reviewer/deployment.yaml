apiVersion: apps/v1
kind: Deployment
metadata:
  name: reviewer
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: reviewer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: reviewer
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: reviewer
          image: git.home.unbeholden.dev/unbeholden/reviewer:latest@sha256:05c773a5485356eb3c5edf337071b58920d52c85f25d0b5491f5fdd62e3ac24a
          env:
            - name: FORGEJO_URL
              value: https://git.home.unbeholden.dev
          envFrom:
            - secretRef:
                name: reviewer-env
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 3000
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 1Gi
          readinessProbe:
            tcpSocket:
              port: http
          volumeMounts:
            - name: credentials
              mountPath: /app/credentials
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: credentials
          persistentVolumeClaim:
            claimName: credentials
        - name: tmp
          emptyDir:
            sizeLimit: 2Gi
