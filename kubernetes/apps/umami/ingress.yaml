apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: umami
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - umami.unbeholden.dev
      secretName: umami-tls
  rules:
    - host: umami.unbeholden.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: umami
                port:
                  name: http
