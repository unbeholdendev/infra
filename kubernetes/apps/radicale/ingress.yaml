apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: radicale
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  ingressClassName: traefik
  rules:
    - host: cal.home.unbeholden.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: radicale
                port:
                  name: http
