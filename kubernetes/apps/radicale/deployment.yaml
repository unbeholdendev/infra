apiVersion: apps/v1
kind: Deployment
metadata:
  name: radicale
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: radicale
  template:
    metadata:
      labels:
        app.kubernetes.io/name: radicale
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: radicale
          image: ghcr.io/kozea/radicale:3.9.1
          args:
            - --config
            - /etc/radicale/config
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 5232
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /.web/
              port: http
          livenessProbe:
            httpGet:
              path: /.web/
              port: http
            periodSeconds: 30
          volumeMounts:
            - name: config
              mountPath: /etc/radicale
              readOnly: true
            - name: data
              mountPath: /var/lib/radicale
      volumes:
        - name: config
          projected:
            sources:
              - configMap:
                  name: radicale-config
              - secret:
                  name: radicale-users
        - name: data
          persistentVolumeClaim:
            claimName: storage
