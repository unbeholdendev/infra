apiVersion: apps/v1
kind: Deployment
metadata:
  name: ntfy
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: ntfy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ntfy
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: copy-data
          image: docker.io/binwiederhier/ntfy:v2.37.2
          command:
            - /bin/sh
            - -ec
            - |
              if [ ! -e /old/.copied-to-local-path ]; then
                find /var/lib/ntfy -mindepth 1 -delete
                find /old -mindepth 1 -maxdepth 1 -exec sh -c 'cp -a "$@" /var/lib/ntfy/' sh {} +
                touch /old/.copied-to-local-path
              fi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
          volumeMounts:
            - name: old-data
              mountPath: /old
            - name: data
              mountPath: /var/lib/ntfy
      containers:
        - name: ntfy
          image: docker.io/binwiederhier/ntfy:v2.37.2
          args:
            - serve
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /v1/health
              port: http
          livenessProbe:
            httpGet:
              path: /v1/health
              port: http
            periodSeconds: 30
          volumeMounts:
            - name: config
              mountPath: /etc/ntfy
              readOnly: true
            - name: data
              mountPath: /var/lib/ntfy
      volumes:
        - name: config
          secret:
            secretName: ntfy-config
        - name: data
          persistentVolumeClaim:
            claimName: storage
        - name: old-data
          persistentVolumeClaim:
            claimName: data
