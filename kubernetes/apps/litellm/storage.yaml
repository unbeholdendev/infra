apiVersion: v1
kind: PersistentVolume
metadata:
  name: litellm-postgres
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  capacity:
    storage: 4Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  claimRef:
    namespace: litellm
    name: postgres
  local:
    path: /var/mnt/litellm-postgres
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - talos-worker-01
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: ""
  volumeName: litellm-postgres
  resources:
    requests:
      storage: 4Gi
