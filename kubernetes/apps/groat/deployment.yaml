apiVersion: apps/v1
kind: Deployment
metadata:
  name: groat
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: groat
  template:
    metadata:
      labels:
        app.kubernetes.io/name: groat
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: copy-data
          image: ghcr.io/unbeholdendev/groat:v0.0.1-alpha15
          command:
            - /bin/sh
            - -ec
            - |
              if [ ! -e /old/.copied-to-local-path ]; then
                find /data -mindepth 1 -delete
                find /old -mindepth 1 -maxdepth 1 -exec sh -c 'cp -a "$@" /data/' sh {} +
                touch /old/.copied-to-local-path
              fi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
          volumeMounts:
            - name: old-data
              mountPath: /old
            - name: data
              mountPath: /data
      containers:
        - name: groat
          image: ghcr.io/unbeholdendev/groat:v0.0.1-alpha15
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          env:
            - name: DB_PATH
              value: /data/expenses.db
          ports:
            - name: http
              containerPort: 3000
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /
              port: http
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 15
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: storage
        - name: old-data
          persistentVolumeClaim:
            claimName: data
