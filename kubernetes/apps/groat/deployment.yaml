apiVersion: apps/v1
kind: Deployment
metadata:
  name: groat
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: groat
  template:
    metadata:
      labels:
        app.kubernetes.io/name: groat
      annotations:
        k8up.io/backupcommand: >-
          bun -e 'const {Database}=require("bun:sqlite"),fs=require("fs"),f="/tmp/k8up-backup.sqlite";fs.rmSync(f,{force:true});new Database(process.env.DB_PATH,{readonly:true}).run("VACUUM INTO ?",[f]);await Bun.write(Bun.stdout,Bun.file(f));fs.rmSync(f)'
        k8up.io/file-extension: .sqlite
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: groat
          image: ghcr.io/unbeholdendev/groat:v0.1.4
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          env:
            - name: DB_PATH
              value: /data/expenses.db
          ports:
            - name: http
              containerPort: 3000
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /
              port: http
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 15
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: storage
