apiVersion: v1
kind: Service
metadata:
  name: wallet
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 60846
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: wallet-goddard
  labels:
    kubernetes.io/service-name: wallet
addressType: IPv4
ports:
  - name: http
    port: 60846
    protocol: TCP
endpoints:
  - addresses:
      - 192.168.4.11
