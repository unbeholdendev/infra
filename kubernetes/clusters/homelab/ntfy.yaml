apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: ntfy
  namespace: flux-system
spec:
  dependsOn:
    - name: local-path-provisioner
    - name: traefik
  interval: 10m
  path: ./kubernetes/apps/ntfy
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: true
  timeout: 20m
