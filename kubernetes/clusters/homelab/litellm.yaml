apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: litellm
  namespace: flux-system
spec:
  dependsOn:
    - name: traefik
    - name: cert-issuers
  interval: 10m
  path: ./kubernetes/apps/litellm
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: true
  timeout: 20m
